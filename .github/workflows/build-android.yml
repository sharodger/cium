# GitHub Actions —— 云端构建 Android APK（业主维权AI助手）
#
# 为什么用云端：Buildozer 只能在 Linux 跑，本机 Windows 无 WSL2/Hyper-V 无法构建。
# GitHub 提供免费 Linux 机器（公开仓库免费），推代码上去自动出 APK。
#
# 触发方式（三选一）：
#   1) 手动：GitHub 仓库 Actions 页 → 选本工作流 → Run workflow
#   2) 打标签：git tag v1.0 && git push origin v1.0
#   3) 推送 main 分支
#
# 产物：构建完成后在 Actions 运行页的 Artifacts 区下载 APK 压缩包。

name: Build Android APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main]        # 推送 main 触发
    tags: ['v*']            # 打 v 开头标签触发，如 v1.0

jobs:
  build:
    runs-on: ubuntu-22.04   # buildozer/p4a 在 22.04 上最稳定

    steps:
      # 1) 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 下载开源中文字体（Apache-2.0），解决 Android 上中文显示方块
      - name: Download Chinese font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/DroidSansFallbackFull.ttf \
            https://raw.githubusercontent.com/isis-project/isis-fonts/master/DroidSansFallbackFull.ttf
          curl -fsSL -o assets/fonts/DroidSansFallbackFull.LICENSE \
            https://raw.githubusercontent.com/isis-project/isis-fonts/master/MODULE_LICENSE_APACHE2
          curl -fsSL -o assets/fonts/DroidSansFallbackFull.NOTICE \
            https://raw.githubusercontent.com/isis-project/isis-fonts/master/NOTICE
          test -s assets/fonts/DroidSansFallbackFull.ttf

      # 3) 设置 Java 17（Gradle 8.x / AGP 要求 17；系统默认 JDK 11 会让构建失败）
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4) 设置 Python（3.11 对 p4a 兼容性好；3.13 部分 recipe 未适配）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5) 安装 Linux 系统依赖（buildozer/p4a 官方要求）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev python3-pip

      # 6) 安装 buildozer 与 Cython（p4a 需要 Cython<3）
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer" "cython<3"

      # 7) 复制配置到项目根目录（buildozer 默认读根目录的 buildozer.spec）
      - name: Prepare buildozer.spec
        run: cp android/buildozer.spec ./buildozer.spec

      # 8) 缓存 SDK/NDK 与构建产物，加速后续构建（首次仍要下载数 GB）
      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}

      # 9) 构建 debug APK（首次约 20-40 分钟）
      - name: Build APK
        run: buildozer -v android debug

      # 10) 上传 APK 供下载（artifact 默认保留 90 天，这里设 30 天）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ownerrightsai-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
